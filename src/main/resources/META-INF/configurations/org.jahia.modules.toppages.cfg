# default configuration - won't be overridden
#
# Configuration of the topPages module.
#
# topPagesCronExp: Quartz cron expression for the job that refreshes every jtopmix:topPages node,
# in both the default and the live workspace. Quartz 1.8 syntax (seconds minutes hours
# day-of-month month day-of-week [year]). The default is every Sunday at midnight.
topPagesCronExp = 0 0 0 ? * 1 *
